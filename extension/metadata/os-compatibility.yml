name: OS Compatibility Maintenance Agent
capabilities:
  - windows-compatibility-fix
  - linux-compatibility-fix
  - jni-jna-updates
  - native-library-management
  - system-path-handling
  - system-integration-update
supported_tools:
  - JNI
  - JNA
  - Apache Commons Lang
  - Java NIO
  - OSHI
  - JCurses/Lanterna
target_platforms:
  - windows-10
  - windows-11
  - windows-server-2019
  - windows-server-2022
  - ubuntu-20.04
  - ubuntu-22.04
  - centos-7
  - centos-8
  - rhel-7
  - rhel-8
  - rhel-9
  - debian-10
  - debian-11
  - alpine-linux
trigger_events:
  - os-compatibility
  - jni-library
  - native-library
  - windows-linux
risk_level: high
estimated_execution_time: 25-80 minutes