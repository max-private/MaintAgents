  - test-coverage-optimization
  - testing-framework-upgrade
  - test-environment-management
  - test-report-generation
  - dotnet-test-framework-upgrade
  - dotnet-coverage-integration
supported_tools:
  - JUnit 4/5
  - Mockito
  - TestNG
  - AssertJ
  - REST-Assured
  - Cucumber
  - Selenium WebDriver
  - Archunit
  - xUnit
  - NUnit
  - MSTest
  - Moq
  - NSubstitute
  - FakeItEasy
  - coverlet
  - dotnet test
  - ReportGenerator
