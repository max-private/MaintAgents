name: Perl Maintenance Agent
version: 1.0.0
language: perl
capabilities:
  - perl-version-upgrade
  - cpan-dependency-management
  - perl-modernization
  - oo-framework-migration
  - perl-security-hardening
  - build-tool-optimization
supported_tools:
  - cpan
  - cpanm
  - Carton
  - Dist::Zilla
  - Module::Build
  - ExtUtils::MakeMaker
  - Perl::Critic
  - perltidy
  - prove
  - perlbrew
target_versions:
  - perl5.20
  - perl5.24
  - perl5.28
  - perl5.32
  - perl5.36
  - perl5.38
  - perl5.40
priority_areas:
  - performance
  - code-quality
  - compatibility
  - maintainability
trigger_events:
  - perl-upgrade
  - cpan-update
  - perl-modernization
  - perl-critic-issue
  - moose-migration
  - perl-deprecation
  - carton-issue
risk_level: medium
estimated_execution_time: 20-75 minutes
